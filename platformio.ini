[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.13.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    ncmreynolds/ld2410@0.2.2
